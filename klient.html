    $('#co').textContent = (d.co.n || 'Домилия').toUpperCase(); $('#sub').textContent = 'Кабинет заказчика · №' + d.o.num; document.title = d.o.n + ' — ' + d.co.n;
    if (first){ tabs(); } return poll().then(render).then(function(){ if (!first || !IB) return; var k = 'dkv_' + ID, last = +localStorage.getItem(k) || 0; if (Date.now() - last > 30 * 60000){ localStorage.setItem(k, Date.now()); send({ t:'view' }).catch(function(){}); } }); }); }
  load(true).catch(function(er){ if (er && er.message === 'closed'){ app.innerHTML = '<div class="card err">Доступ к этому кабинету закрыт. Попросите менеджера прислать новую ссылку.</div>'; return; } app.innerHTML = '<div class="card err">Не удалось открыть кабинет. Проверьте интернет и обновите страницу.<br><small class="muted">Откройте в Chrome, Safari или Яндекс Браузере.</small></div>'; });
  if (live){ setInterval(function(){ if (!document.hidden) poll(); }, 20000); document.addEventListener('visibilitychange', function(){ if (!document.hidden && D) load(false).catch(function(){}); }); }
})();
