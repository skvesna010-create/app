<script>
(function(){
  var E = JSON.parse(document.getElementById('enc').textContent), C = window.crypto.subtle;
  function u8(b){ var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function b64(a){ var s = ''; a = new Uint8Array(a); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function open(key){ return C.decrypt({ name:'AES-GCM', iv:u8(E.i) }, key, u8(E.c)).then(function(b){ var P = JSON.parse(new TextDecoder().decode(b));
    document.body.className = ''; document.body.innerHTML = P.html; var s = document.createElement('script'); s.textContent = P.js; document.body.appendChild(s); }); }
  var err = document.getElementById('err'), btn = document.getElementById('go');
  if (!C){ err.textContent = 'Браузер не поддерживает шифрование. Откройте сайт по https:// в Chrome, Яндекс Браузере или Safari.'; return; }
  var saved = null; try { saved = JSON.parse(localStorage.getItem('dprokey') || 'null'); } catch(e){}
  if (saved && saved.s === E.s){ btn.textContent = 'Открываю…'; C.importKey('raw', u8(saved.k), 'AES-GCM', true, ['decrypt']).then(open).catch(function(){ localStorage.removeItem('dprokey'); btn.textContent = 'Войти'; }); }
  document.getElementById('gate').onsubmit = function(e){ e.preventDefault(); var pw = document.getElementById('pw').value; if (!pw) return; err.textContent = ''; btn.textContent = 'Проверяю…'; btn.disabled = true;
    C.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey'])
      .then(function(b){ return C.deriveKey({ name:'PBKDF2', salt:u8(E.s), iterations:600000, hash:'SHA-256' }, b, { name:'AES-GCM', length:256 }, true, ['decrypt']); })
      .then(function(k){ return C.decrypt({ name:'AES-GCM', iv:u8(E.i) }, k, u8(E.c)).then(function(){ if (document.getElementById('rem').checked) return C.exportKey('raw', k).then(function(r){ try { localStorage.setItem('dprokey', JSON.stringify({ s:E.s, k:b64(r) })); } catch(x){} return k; }); return k; }); })
      .then(open)
      .catch(function(){ err.textContent = 'Неверный пароль'; btn.textContent = 'Войти'; btn.disabled = false; document.getElementById('pw').select(); });
  };
})();
</script>
